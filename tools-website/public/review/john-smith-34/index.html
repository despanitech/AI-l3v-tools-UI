<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>John Smith · 34 identity directions</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap');
:root{--ink:#15231d;--paper:#f2f0e8;--card:#fffefa;--line:#cfd4cb;--green:#315f49;--gold:#a86e16}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#e4dec9 0,transparent 35%),var(--paper);color:var(--ink);font-family:'DM Mono',monospace}header{position:sticky;top:0;z-index:4;padding:22px clamp(18px,5vw,72px);background:rgba(242,240,232,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}header>div{max-width:1540px;margin:auto;display:flex;align-items:end;justify-content:space-between;gap:24px}small{color:var(--gold);font-weight:500;letter-spacing:.18em}h1,h2{font-family:Newsreader,serif}h1{font-size:clamp(36px,5vw,72px);line-height:.9;margin:8px 0 0;font-weight:500}header p{max-width:590px;margin:0;line-height:1.55;color:#526159}.summary{white-space:nowrap;padding:10px 14px;border:1px solid var(--green);border-radius:999px;color:var(--green)}main{max-width:1540px;margin:auto;padding:32px clamp(18px,5vw,72px) 90px}.category{margin:0 0 54px}.category-head{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}.category h2{font-size:36px;margin:0}.count{color:#6d796f}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{position:relative;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;text-align:left;color:inherit;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #25362a16}.card[aria-pressed=true]{border:3px solid var(--green);box-shadow:0 0 0 3px #315f4920}.card img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff}.card[data-category=signature] img{aspect-ratio:16/9}.meta{display:flex;justify-content:space-between;align-items:center;padding:12px 13px}.meta span{font-size:12px}.pick{display:grid;place-items:center;width:25px;height:25px;border:1px solid var(--line);border-radius:50%}.card[aria-pressed=true] .pick{background:var(--green);color:white}.selected{position:fixed;left:50%;bottom:18px;z-index:5;transform:translateX(-50%);display:flex;gap:20px;align-items:center;width:min(720px,calc(100% - 28px));padding:14px 18px;background:#15231ded;color:white;border-radius:14px;box-shadow:0 16px 50px #0003;backdrop-filter:blur(12px)}.selected strong{margin-left:auto;color:#e4c77f}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}header>div{align-items:start;flex-direction:column}.summary{display:none}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr);gap:8px}.category h2{font-size:28px}.meta{padding:9px}.meta span{font-size:10px}.selected{font-size:11px;gap:8px}}
</style></head><body><header><div><div><small>GENERATED FOR REVIEW · CATEGORY-BOUND</small><h1>John Smith<br>34 directions</h1></div><p>Choose one result from each real product category. Every image carries its own mode metadata; position and generation order are irrelevant.</p><div class="summary">5 logo · 14 initials · 15 signature</div></div></header><main id="gallery"></main><aside class="selected"><span>YOUR PICKS</span><span id="picks">Choose one from each category</span><strong id="progress">0 / 3</strong></aside><script>
const labels={logo:'Name logo',initials:'Initials',signature:'Signature'},order=['logo','initials','signature'],chosen={};
fetch('./manifest.json').then(r=>r.json()).then(items=>{const main=document.querySelector('#gallery');for(const category of order){const group=items.filter(x=>x.category===category),section=document.createElement('section');section.className='category';section.innerHTML=`<div class="category-head"><h2>${labels[category]}</h2><span class="count">${group.length} generated</span></div><div class="grid"></div>`;const grid=section.querySelector('.grid');for(const item of group){const button=document.createElement('button');button.className='card';button.dataset.category=category;button.setAttribute('aria-pressed','false');button.innerHTML=`<img loading="lazy" src="./${item.job}.png" alt="John Smith ${item.styleName} ${labels[category]}"><span class="meta"><span>${item.styleName}</span><b class="pick">+</b></span>`;button.onclick=()=>{grid.querySelectorAll('.card').forEach(x=>{x.setAttribute('aria-pressed','false');x.querySelector('.pick').textContent='+'});button.setAttribute('aria-pressed','true');button.querySelector('.pick').textContent='✓';chosen[category]=item;render()};grid.append(button)}main.append(section)}});
function render(){const values=order.filter(x=>chosen[x]);document.querySelector('#picks').textContent=values.length?values.map(x=>`${labels[x]}: ${chosen[x].styleName}`).join(' · '):'Choose one from each category';document.querySelector('#progress').textContent=`${values.length} / 3`;localStorage.setItem('john-smith-34-picks',JSON.stringify(chosen))}
</script></body></html>
